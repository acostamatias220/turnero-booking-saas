# Local stack: app (http://localhost:8080), queue worker, scheduler, MySQL and Mailpit
# (http://localhost:8025 to read the confirmation/reminder e-mails).
#
#   cp .env.example .env    # then set APP_KEY (php artisan key:generate --show) and passwords
#   docker compose up -d --build
#   docker compose exec app php artisan db:seed
#
x-app: &app
  build: .
  env_file: .env
  environment:
    DB_HOST: mysql
    MAIL_MAILER: smtp
    MAIL_HOST: mailpit
    MAIL_PORT: 1025
    QUEUE_CONNECTION: database
    APP_URL: http://localhost:8080
  depends_on:
    mysql:
      condition: service_healthy

services:
  app:
    <<: *app
    ports: ['8080:8080']

  queue:
    <<: *app
    command: ['php', '/var/www/html/artisan', 'queue:work', '--tries=3', '--backoff=10']
    environment:
      DB_HOST: mysql
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      AUTORUN_ENABLED: 'false'
    healthcheck:
      disable: true

  scheduler:
    <<: *app
    command: ['php', '/var/www/html/artisan', 'schedule:work']
    environment:
      DB_HOST: mysql
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      AUTORUN_ENABLED: 'false'
    healthcheck:
      disable: true

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-turnero}
      MYSQL_USER: ${DB_USERNAME:-turnero}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
    volumes: ['mysql-data:/var/lib/mysql']
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1']
      interval: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports: ['8025:8025']

volumes:
  mysql-data:
